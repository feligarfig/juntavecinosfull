services:
  php:
    image: php:8.2-apache
    container_name: juntavecinos-php
    ports:
      - "8001:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: juntavecinos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: juntavecinos
    ports:
      - "80:80"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/socios.sql:/docker-entrypoint-initdb.d/socios.sql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: juntavecinos-phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: 12345
    ports:
      - "80:80"
    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge